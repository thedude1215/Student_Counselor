<div style="margin:0;background:#f7f4ec;padding:32px 16px;font-family:Inter,Arial,sans-serif;color:#10261b;">
  <div style="max-width:560px;margin:0 auto;background:#fffdf8;border:1px solid #cfe5da;border-radius:24px;box-shadow:0 18px 48px rgba(16,38,27,0.10);overflow:hidden;">
    <div style="padding:28px 30px 18px;border-bottom:1px solid #e4eee8;">
      <div style="font-size:14px;font-weight:900;letter-spacing:0.14em;text-transform:uppercase;color:#059669;">ScholarPath</div>
      <h1 style="margin:14px 0 0;font-size:30px;line-height:1.1;font-weight:900;color:#10261b;">Reset your password</h1>
    </div>
    <div style="padding:28px 30px 32px;">
      <p style="margin:0 0 18px;font-size:16px;line-height:1.55;color:#536157;">
        Enter this code on ScholarPath, then choose your new password.
      </p>
      <div style="margin:24px 0;padding:20px;border-radius:18px;background:#e9fff2;border:1px solid #8df1b6;text-align:center;">
        <div style="font-size:12px;font-weight:900;letter-spacing:0.16em;text-transform:uppercase;color:#087f5b;">Reset code</div>
        <div style="margin-top:10px;font-size:40px;line-height:1;font-weight:900;letter-spacing:0.22em;color:#06351f;">{{ .Token }}</div>
      </div>
      <p style="margin:0;font-size:14px;line-height:1.55;color:#6f7a72;">
        If you did not ask to reset your password, you can safely ignore this email.
      </p>
    </div>
  </div>
</div>
